      <text x="185" y="1332" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Book a Free Demo  →</text>
      <text x="80" y="1372" fill="#737d9c" font-size="11">.btn-primary</text>

      <rect x="314" y="1300" width="180" height="52" rx="8" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.5"/>
      <text x="404" y="1332" fill="#283c9e" font-size="15" font-weight="800" text-anchor="middle">View Curriculum</text>
      <text x="314" y="1372" fill="#737d9c" font-size="11">.btn-outline</text>
    </g>

    <!-- dark strip with light buttons -->
