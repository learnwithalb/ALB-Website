  <!-- ══ TYPOGRAPHY PANEL ══ -->
  <g>
    <rect x="48" y="762" width="1344" height="430" rx="8" fill="#ffffff" filter="url(#soft)"/>
    <text x="80" y="812" fill="#0e1733" font-size="22" font-weight="900">Typography</text>
    <text x="80" y="834" fill="#737d9c" font-size="13">Satoshi for everything; Cormorant Garamond (serif italic) for signatures &amp; flourishes.</text>

    <text x="80"  y="900" fill="#0e1733" font-size="48" font-weight="900" letter-spacing="-1.5">Go Global. Speak <tspan fill="url(#gradText)">Fluent.</tspan></text>
    <text x="80"  y="920" fill="#737d9c" font-size="12">Satoshi Black · 900 · display / h1 · tracking -2.5%</text>

    <text x="80"  y="978" fill="#0e1733" font-size="30" font-weight="900">Section heading — h2</text>
    <text x="80"  y="998" fill="#737d9c" font-size="12">Satoshi Black · 900 · 30px</text>

    <text x="80"  y="1044" fill="#46506e" font-size="16">Body copy uses Satoshi Regular at 16px with 1.6 line-height for comfortable reading.</text>
    <text x="80"  y="1064" fill="#737d9c" font-size="12">Satoshi Regular · 400 · 16px · line-height 1.6</text>

    <g>
      <rect x="80" y="1096" width="186" height="34" rx="17" fill="#eef2ff" stroke="#c2d2ff"/>
      <circle cx="100" cy="1113" r="3" fill="#3b5bdb"/>
      <text x="116" y="1118" fill="#283c9e" font-size="12" font-weight="700" letter-spacing="1.6">WHY ALB</text>
    </g>
    <text x="284" y="1118" fill="#737d9c" font-size="12">Eyebrow · Satoshi Bold · 12px · uppercase · tracking 10%</text>

    <text x="820" y="1000" fill="#0e1733" font-size="44" font-style="italic" font-family="'Cormorant Garamond', Georgia, serif">Speak. Connect. Belong.</text>
    <text x="820" y="1028" fill="#737d9c" font-size="12">Cormorant Garamond · Italic · display accent</text>
    <text x="820" y="1080" fill="#0e1733" font-size="34" font-style="italic" font-family="'Cormorant Garamond', Georgia, serif">Jasmine Kaur</text>
    <text x="820" y="1104" fill="#737d9c" font-size="12">Signature style</text>
  </g>

