      <rect x="572" y="1326" width="180" height="52" rx="8" fill="#ffffff"/>
      <text x="662" y="1358" fill="#0e1733" font-size="15" font-weight="800" text-anchor="middle">Get Started  →</text>
      <rect x="772" y="1326" width="180" height="52" rx="8" fill="#02072a" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="862" y="1358" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Learn More</text>
      <text x="572" y="1402" fill="#9bb2ff" font-size="11">.btn-white  ·  .btn-outline-light  (for dark sections)</text>
    </g>

    <!-- card sample -->
    <g>
      <rect x="1080" y="1294" width="280" height="240" rx="8" fill="#ffffff" stroke="#e6ebf5" filter="url(#soft)"/>
      <rect x="1080" y="1294" width="280" height="4" rx="2" fill="url(#gradText)"/>
      <rect x="1104" y="1322" width="150" height="28" rx="14" fill="#eef2ff" stroke="#c2d2ff"/>
      <text x="1116" y="1340" fill="#283c9e" font-size="11" font-weight="700" letter-spacing="1.2">TRACK</text>
      <text x="1104" y="1392" fill="#0e1733" font-size="20" font-weight="900">Goal-based</text>
      <text x="1104" y="1416" fill="#0e1733" font-size="20" font-weight="900">learning paths</text>
      <text x="1104" y="1448" fill="#737d9c" font-size="12.5">Choose a pathway built around</text>
      <text x="1104" y="1466" fill="#737d9c" font-size="12.5">your real-world goal.</text>
      <rect x="1104" y="1486" width="120" height="34" rx="8" fill="url(#gradPrimary)"/>
      <text x="1164" y="1508" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">Explore  →</text>
      <text x="1080" y="1556" fill="#737d9c" font-size="11">.card-feature</text>
    </g>

    <!-- stat + pill samples -->
    <g>
      <rect x="80" y="1420" width="150" height="86" rx="8" fill="#f3f6ff" stroke="#e6ebf5"/>
      <text x="155" y="1466" fill="url(#gradText)" font-size="30" font-weight="900" text-anchor="middle">95%</text>
      <text x="155" y="1490" fill="#737d9c" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">GOAL RATE</text>
      <text x="80" y="1528" fill="#737d9c" font-size="11">stat block</text>

      <rect x="252" y="1420" width="180" height="50" rx="25" fill="#02072a"/>
      <text x="342" y="1451" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Pill / tab (active)</text>
      <rect x="252" y="1480" width="180" height="50" rx="25" fill="#ffffff" stroke="#e6ebf5"/>
      <text x="342" y="1511" fill="#46506e" font-size="14" font-weight="800" text-anchor="middle">Pill / tab (idle)</text>
    </g>
  </g>

  <!-- ══ FOUNDATIONS PANEL ══ -->
  <g>
    <rect x="48" y="1636" width="1344" height="300" rx="8" fill="#ffffff" filter="url(#soft)"/>
    <text x="80" y="1686" fill="#0e1733" font-size="22" font-weight="900">Foundations</text>

    <!-- gradients -->
    <text x="80" y="1724" fill="#46506e" font-size="12" font-weight="700" letter-spacing="1">GRADIENTS</text>
