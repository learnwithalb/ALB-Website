      <rect x="544" y="592" width="112" height="64" rx="8" fill="#f3f6ff" stroke="#e6ebf5"/><text x="600"  y="629" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#f3f6ff</text><text x="600"  y="676" fill="#46506e" font-size="11" text-anchor="middle">mist</text>
      <rect x="660" y="592" width="112" height="64" rx="8" fill="#e9efff" stroke="#e6ebf5"/><text x="716"  y="629" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#e9efff</text><text x="716"  y="676" fill="#46506e" font-size="11" text-anchor="middle">haze</text>
      <rect x="776" y="592" width="112" height="64" rx="8" fill="#ffffff" stroke="#e6ebf5"/><text x="832"  y="629" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#ffffff</text><text x="832"  y="676" fill="#46506e" font-size="11" text-anchor="middle">cloud</text>
      <rect x="892" y="592" width="112" height="64" rx="8" fill="#02072a"/><text x="948"  y="629" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#02072a</text><text x="948"  y="676" fill="#46506e" font-size="11" text-anchor="middle">navy · dark bg</text>
    </g>
