    <text x="270" y="1820" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">btn-primary · 135°</text>

    <!-- radius -->
    <text x="520" y="1724" fill="#46506e" font-size="12" font-weight="700" letter-spacing="1">RADIUS</text>
    <rect x="520" y="1736" width="88" height="88" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="564" y="1786" fill="#283c9e" font-size="16" font-weight="900" text-anchor="middle">8px</text>
    <text x="520" y="1844" fill="#737d9c" font-size="11">unified across the site</text>

    <!-- shadows -->
    <text x="680" y="1724" fill="#46506e" font-size="12" font-weight="700" letter-spacing="1">SHADOWS</text>
    <rect x="680" y="1740" width="120" height="80" rx="8" fill="#ffffff" filter="url(#soft)"/>
    <text x="740" y="1786" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">soft</text>
    <rect x="828" y="1740" width="120" height="80" rx="8" fill="#ffffff" filter="url(#lift)"/>
    <text x="888" y="1786" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">lift</text>

    <!-- fonts -->
    <text x="1010" y="1724" fill="#46506e" font-size="12" font-weight="700" letter-spacing="1">FONTS</text>
    <text x="1010" y="1762" fill="#0e1733" font-size="22" font-weight="900">Satoshi</text>
    <text x="1010" y="1782" fill="#737d9c" font-size="12">UI &amp; body · 300/400/500/700/900</text>
    <text x="1010" y="1822" fill="#0e1733" font-size="24" font-style="italic" font-family="'Cormorant Garamond', Georgia, serif">Cormorant Garamond</text>
    <text x="1010" y="1842" fill="#737d9c" font-size="12">display accents &amp; signatures</text>
