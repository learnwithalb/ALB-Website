<svg width="1440" height="1980" viewBox="0 0 1440 1980" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Satoshi, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#3b5bdb"/>
      <stop offset="55%" stop-color="#6d8bff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gradPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b5bdb"/>
      <stop offset="55%" stop-color="#5f80f5"/>
      <stop offset="100%" stop-color="#2f49c0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101733" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#2b49c0" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1440" height="1980" fill="#f3f6ff"/>

  <!-- ══ HEADER ══ -->
  <g>
    <rect x="48" y="48" width="44" height="44" rx="8" fill="url(#gradPrimary)"/>
    <text x="70" y="78" fill="#ffffff" font-size="22" font-weight="900" text-anchor="middle">A</text>
    <text x="108" y="70" fill="#0e1733" font-size="15" font-weight="700">Academy of Languages &amp; Beyond</text>
    <text x="108" y="88" fill="#737d9c" font-size="12" font-weight="600" letter-spacing="2">DESIGN KIT</text>
    <text x="1392" y="78" fill="#737d9c" font-size="13" font-weight="600" text-anchor="end">Royal Blue · Satoshi · 8px radius · light-first</text>
  </g>
  <text x="48" y="150" fill="#0e1733" font-size="52" font-weight="900" letter-spacing="-1.5">Design <tspan fill="url(#gradText)">Kit</tspan></text>

  <!-- ══ COLOR PANEL ══ -->
  <g>
    <rect x="48" y="190" width="1344" height="540" rx="8" fill="#ffffff" filter="url(#soft)"/>
    <text x="80" y="240" fill="#0e1733" font-size="22" font-weight="900">Colour</text>
    <text x="80" y="262" fill="#737d9c" font-size="13">Royal Blue is primary. Sky is the accent, amber is reserved for stars &amp; highlights.</text>

    <!-- Royal scale -->
    <text x="80" y="298" fill="#46506e" font-size="12" font-weight="700" letter-spacing="1">ROYAL (PRIMARY)</text>
    <g>
      <rect x="80"   y="312" width="112" height="64" rx="8" fill="#eef2ff" stroke="#e6ebf5"/><text x="136"  y="349" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#eef2ff</text><text x="136"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-50</text>
      <rect x="196"  y="312" width="112" height="64" rx="8" fill="#dde6ff"/><text x="252"  y="349" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#dde6ff</text><text x="252"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-100</text>
      <rect x="312"  y="312" width="112" height="64" rx="8" fill="#c2d2ff"/><text x="368"  y="349" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#c2d2ff</text><text x="368"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-200</text>
      <rect x="428"  y="312" width="112" height="64" rx="8" fill="#9bb2ff"/><text x="484"  y="349" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#9bb2ff</text><text x="484"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-300</text>
      <rect x="544"  y="312" width="112" height="64" rx="8" fill="#6d8bff"/><text x="600"  y="349" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#6d8bff</text><text x="600"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-400</text>
      <rect x="660"  y="312" width="112" height="64" rx="8" fill="#3b5bdb"/><text x="716"  y="345" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#3b5bdb</text><text x="716"  y="361" fill="#c2d2ff" font-size="9" font-weight="700" text-anchor="middle">PRIMARY</text><text x="716"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-500</text>
      <rect x="776"  y="312" width="112" height="64" rx="8" fill="#2f49c0"/><text x="832"  y="349" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#2f49c0</text><text x="832"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-600</text>
      <rect x="892"  y="312" width="112" height="64" rx="8" fill="#283c9e"/><text x="948"  y="349" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#283c9e</text><text x="948"  y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-700</text>
      <rect x="1008" y="312" width="112" height="64" rx="8" fill="#21317d"/><text x="1064" y="349" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#21317d</text><text x="1064" y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-800</text>
      <rect x="1124" y="312" width="112" height="64" rx="8" fill="#1b2a63"/><text x="1180" y="349" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#1b2a63</text><text x="1180" y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-900</text>
      <rect x="1240" y="312" width="112" height="64" rx="8" fill="#111a40"/><text x="1296" y="349" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#111a40</text><text x="1296" y="396" fill="#46506e" font-size="11" text-anchor="middle">royal-950</text>
    </g>

    <!-- Sky + Amber -->
    <text x="80" y="438" fill="#46506e" font-size="12" font-weight="700" letter-spacing="1">SKY ACCENT &amp; AMBER</text>
    <g>
      <rect x="80"  y="452" width="112" height="64" rx="8" fill="#7dd3fc"/><text x="136" y="489" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#7dd3fc</text><text x="136" y="536" fill="#46506e" font-size="11" text-anchor="middle">sky-300</text>
      <rect x="196" y="452" width="112" height="64" rx="8" fill="#38bdf8"/><text x="252" y="489" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#38bdf8</text><text x="252" y="536" fill="#46506e" font-size="11" text-anchor="middle">sky-400</text>
      <rect x="312" y="452" width="112" height="64" rx="8" fill="#0ea5e9"/><text x="368" y="489" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#0ea5e9</text><text x="368" y="536" fill="#46506e" font-size="11" text-anchor="middle">sky-500</text>
      <rect x="486" y="452" width="112" height="64" rx="8" fill="#fbbf24"/><text x="542" y="489" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#fbbf24</text><text x="542" y="536" fill="#46506e" font-size="11" text-anchor="middle">amber-400</text>
      <rect x="602" y="452" width="112" height="64" rx="8" fill="#f59e0b"/><text x="658" y="489" fill="#0e1733" font-size="12" font-weight="700" text-anchor="middle">#f59e0b</text><text x="658" y="536" fill="#46506e" font-size="11" text-anchor="middle">amber-500</text>
    </g>

    <!-- Neutrals -->
    <text x="80" y="578" fill="#46506e" font-size="12" font-weight="700" letter-spacing="1">NEUTRALS &amp; TEXT</text>
    <g>
      <rect x="80"  y="592" width="112" height="64" rx="8" fill="#0e1733"/><text x="136"  y="629" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#0e1733</text><text x="136"  y="676" fill="#46506e" font-size="11" text-anchor="middle">ink · headings</text>
      <rect x="196" y="592" width="112" height="64" rx="8" fill="#46506e"/><text x="252"  y="629" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#46506e</text><text x="252"  y="676" fill="#46506e" font-size="11" text-anchor="middle">body</text>
      <rect x="312" y="592" width="112" height="64" rx="8" fill="#737d9c"/><text x="368"  y="629" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">#737d9c</text><text x="368"  y="676" fill="#46506e" font-size="11" text-anchor="middle">muted</text>
